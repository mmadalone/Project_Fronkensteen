- sensor:
    - name: "Sonarr Disk Space in Terabytes"
      unique_id: sonarr_disk_space_tb
      unit_of_measurement: "TB"
      state: >
        {% set gigabytes = states('sensor.sonarr_disk_space') | float(0) %}
        {{ (gigabytes / 1024) | round(2) }}

    - name: "Radarr Disk Space in Terabytes"
      unique_id: radarr_disk_space_tb
      unit_of_measurement: "TB"
      state: >
        {% set gigabytes = states('sensor.radarr_disk_space_movies') | float(0) %}
        {{ (gigabytes / 1024) | round(2) }}

    - name: "OpenWrt Router Data Received in GB"
      unique_id: openwrt_data_received_gb
      unit_of_measurement: "GB"
      state: >
        {% set megabytes = states('sensor.openwrt_router_data_received') | float(0) %}
        {{ (megabytes / 1024) | round(2) }}

    - name: "OpenWrt Router Data Sent in GB"
      unique_id: openwrt_data_sent_gb
      unit_of_measurement: "GB"
      state: >
        {% set megabytes = states('sensor.openwrt_router_data_sent') | float(0) %}
        {{ (megabytes / 1024) | round(2) }}
        
    - name: "HA Voice 01 FW Auto"
      unique_id: ha_voice_01_fw_auto
      state: >
         {{ 'yes' if state_attr('update.ha_voice_01_firmware', 'auto_update') else 'no' }}
    - name: "HA Voice 01 FW Updating"
      unique_id: ha_voice_01_fw_updating
      state: >
          {{ 'yes' if state_attr('update.ha_voice_01_firmware', 'in_progress') else 'no' }}
    
    - name: "HA Voice 02 FW Auto"
      unique_id: ha_voice_02_fw_auto
      state: >
          {{ 'yes' if state_attr('update.ha_voice_2_firmware', 'auto_update') else 'no' }}
    
    - name: "HA Voice 02 FW Updating"
      unique_id: ha_voice_02_fw_updating
      state: >
          {{ 'yes' if state_attr('update.ha_voice_2_firmware', 'in_progress') else 'no' }}

    - name: "MadTeeVee Now Playing"
      unique_id: madteevee_now_playing
      icon: mdi:television-classic
      state: >-
        {% set mp = 'media_player.madteevee' %}
        {% set s = states(mp) %}
        {% if s not in ['playing', 'paused'] %}
          off
        {% else %}
          {% set type = state_attr(mp, 'media_content_type') | default('unknown') %}
          {% set title = state_attr(mp, 'media_title') | default('')
             | regex_replace('\\[COLOR[^\\]]*\\]', '')
             | regex_replace('\\[/COLOR\\]', '')
             | regex_replace('\\[/?B\\]', '')
             | regex_replace('\\[/?I\\]', '')
             | regex_replace('\\[CR\\]', ' ') | trim %}
          {% set series = state_attr(mp, 'media_series_title') | default('') %}
          {% set season = state_attr(mp, 'media_season') | default('') %}
          {% set episode = state_attr(mp, 'media_episode') | default('') %}
          {% set ch = states('sensor.madteevee_pvr_channel') | default('') %}
          {% set is_pvr = ch not in ['', 'off', 'not_pvr', 'unknown', 'unavailable'] %}
          {% set artist = state_attr(mp, 'media_artist') | default('') %}
          {% if type == 'tvshow' %}
            Series: {{ series }} - S{{ '%02d' | format(season | int(0)) }}E{{ '%02d' | format(episode | int(0)) }} - {{ title }}
          {% elif type == 'movie' %}
            Movie: {{ title }}
          {% elif type == 'video' and is_pvr %}
            Live TV: {{ title }} ({{ ch }})
          {% elif type == 'video' and artist %}
            Video: {{ title }} ({{ artist }})
          {% elif type == 'video' %}
            Video: {{ title }}
          {% else %}
            {{ title }}
          {% endif %}
        {% endif %}
      attributes:
        media_category: >-
          {% if states('media_player.madteevee') not in ['playing', 'paused'] %}unknown
          {% else %}
            {% set type = state_attr('media_player.madteevee', 'media_content_type') | default('unknown') %}
            {% set series = state_attr('media_player.madteevee', 'media_series_title') | default('') %}
            {% set ch = states('sensor.madteevee_pvr_channel') | default('') %}
            {% set is_pvr = ch not in ['', 'off', 'not_pvr', 'unknown', 'unavailable'] %}
            {% if type == 'tvshow' %}series
            {% elif type == 'movie' %}movie
            {% elif type == 'video' and is_pvr %}live_tv
            {% elif type == 'video' and series %}series
            {% elif type == 'video' %}video
            {% else %}{{ type }}{% endif %}
          {% endif %}
        media_title: >-
          {% if states('media_player.madteevee') not in ['playing', 'paused'] %}
          {% else %}{{ state_attr('media_player.madteevee', 'media_title') | default('')
             | regex_replace('\\[COLOR[^\\]]*\\]', '')
             | regex_replace('\\[/COLOR\\]', '')
             | regex_replace('\\[/?B\\]', '')
             | regex_replace('\\[/?I\\]', '')
             | regex_replace('\\[CR\\]', ' ') | trim }}{% endif %}
        series_title: >-
          {% if states('media_player.madteevee') not in ['playing', 'paused'] %}
          {% else %}
            {{ state_attr('media_player.madteevee', 'media_series_title') | default('') }}
          {% endif %}
        season: >-
          {% if states('media_player.madteevee') not in ['playing', 'paused'] %}
          {% else %}
            {% set val = state_attr('media_player.madteevee', 'media_season') | default('') %}
            {{ '' if val in ['', None, -1, '-1'] else val }}
          {% endif %}
        episode: >-
          {% if states('media_player.madteevee') not in ['playing', 'paused'] %}
          {% else %}
            {% set val = state_attr('media_player.madteevee', 'media_episode') | default('') %}
            {{ '' if val in ['', None, -1, '-1'] else val }}
          {% endif %}
        player_state: >-
          {{ states('media_player.madteevee') }}
        pvr_channel: >-
          {% if states('media_player.madteevee') not in ['playing', 'paused'] %}
          {% else %}
            {% set ch = states('sensor.madteevee_pvr_channel') | default('') %}
            {{ ch if ch not in ['off', 'not_pvr', 'unknown', 'unavailable'] else '' }}
          {% endif %}
        pvr_channel_number: >-
          {% if states('media_player.madteevee') not in ['playing', 'paused'] %}
          {% else %}{{ state_attr('sensor.madteevee_pvr_channel', 'channelnumber') | default('') }}{% endif %}
        pvr_programme: >-
          {% if states('media_player.madteevee') not in ['playing', 'paused'] %}
          {% else %}
            {% set t = state_attr('sensor.madteevee_pvr_channel', 'title') | default('') %}
            {{ t | regex_replace('\\[COLOR[^\\]]*\\]', '')
                 | regex_replace('\\[/COLOR\\]', '')
                 | regex_replace('\\[/?B\\]', '')
                 | regex_replace('\\[/?I\\]', '')
                 | regex_replace('\\[CR\\]', ' ') | trim }}
          {% endif %}
        plot: >-
          {% if states('media_player.madteevee') not in ['playing', 'paused'] %}
          {% else %}
            {% set p = state_attr('sensor.madteevee_pvr_channel', 'plot') | default('') %}
            {% set p = p | regex_replace('\\[COLOR[^\\]]*\\]', '')
                         | regex_replace('\\[/COLOR\\]', '')
                         | regex_replace('\\[/?B\\]', '')
                         | regex_replace('\\[/?I\\]', '')
                         | regex_replace('\\[CR\\]', ' ') | trim %}
            {{ p[:500] if p else '' }}
          {% endif %}
        media_source: >-
          {% if states('media_player.madteevee') not in ['playing', 'paused'] %}
          {% else %}{{ state_attr('sensor.ai_watch_history_status', 'current_source') | default('', true) }}{% endif %}
        episode_name: >-
          {% if states('media_player.madteevee') not in ['playing', 'paused'] %}
          {% else %}{{ state_attr('sensor.ai_watch_history_status', 'current_episode_name') | default('', true) }}{% endif %}

# ═══════════════════════════════════════════════════════════════════════════
# DEBOUNCED FP2 PRESENCE  (added 2026-08-19)
# ═══════════════════════════════════════════════════════════════════════════
# The Aqara FP2 drops a STATIONARY occupant. Measured over 7 days on the
# workshop zone: ON spans have a median of 4.6s, and 102 of 163 are under 15s.
# The flapping clusters in occupied hours and disappears in empty ones, so it is
# not a faulty sensor — it is the standard mmWave failure mode: someone sits
# still, stops producing motion, is dropped, and is re-detected on the next
# small movement. 327 transitions in 24h on the workshop alone.
#
# That breaks anything requiring sustained presence. Music follow-me needs a
# zone held for 15s, which the workshop essentially never manages — which is why
# music followed the wrong person to the bathroom: the bathroom was simply the
# only zone stable enough to qualify.
#
# delay_off = 60s, chosen by replaying 7 days of real transitions through
# candidate values rather than picked round (scratchpad/sim_delay_off.py):
#
#     delay_off   median ON span   ON spans >= 15s
#         0s            4s              30%
#        30s           37s              66%
#        60s           63s              72%     <- knee
#        90s          114s              74%
#       120s          168s              81%
#
# Past 60s the curve flattens: 60->90 buys 2 points for another 30s of
# departure latency. The OFF-span distribution is a smooth decay, NOT two
# separable populations, so no value cleanly divides "dropout" from "left the
# room" — 60s is a trade-off, not a threshold. The ~28% of ON spans still under
# 15s are mostly genuine walk-throughs, which SHOULD NOT hold a zone.
#
# Cost: a real departure is reported up to 60s late. Acceptable for every
# consumer repointed at these (follow-me, auto-on/off, room routing).
#
# NOT for every consumer. Left deliberately on the raw sensors:
#   - pyscript/presence_identity.py — runs its own dwell + transition tracking
#     (input_number.ai_presence_fp2_dwell_sec); feeding it a pre-smoothed
#     signal would double-filter and skew identity attribution.
#   - packages/ai_focus_guard.yaml:64 — history_stats workshop hours, chosen
#     precisely BECAUSE it is immune to flapping; smoothing would inflate it.
# ═══════════════════════════════════════════════════════════════════════════
# ── ROUND 2 (2026-08-28): delay_on 5s added to the six SUB-ZONE wrappers ───
# Verified diagnosis (10-agent adversarial review + official docs): blips are
# zone-attribution jitter of a PRESENT person — blip rate is 21-117x higher
# while the same radar's whole-area sensor is ON, ~0 in the empty flat; the
# union sensor was OFF only 6s during 51.6h of sub-zone ON, so the radar never
# loses the person, it misattributes them. delay_off:60 alone STRETCHED each
# 1-5s ghost into >=61s of false occupancy (2.3-6.4x inflation).
# Replay simulation on 72h of history: delay_on 5s (the ON-span CDF knee)
# kills 74.8% of blips (77-89% on workshop/kitchen/lobby/shower), loses ZERO
# genuine >=30s stays, removes ~2.2h/day of false occupancy.
# NOT on ai_presence_bathroom / ai_presence_main_room: those are the FP2s'
# whole-area sensors ("Presence Sensor 1" = union of the field) — ~1% of their
# ON spans are <5s, nothing to kill, and entry latency matters there.
# Cost: genuine sub-5s walk-throughs are SUPPRESSED, not delayed. Accepted.
# Compensation in the same round: zone_presence presence_delay reduced by 5s
# (workshop 10->5, living room 5->0) so net entry latency is unchanged; the
# 2026-08-19 repoint was FINISHED (48 automations.yaml + 3 scripts.yaml refs
# raw->wrapper; "Bathroom occupancy" lighting deliberately kept RAW for
# instant entry); presence_identity.py gained a 5s ON-confirmation.
# ═══════════════════════════════════════════════════════════════════════════
- binary_sensor:
    - name: "AI Presence Workshop"
      unique_id: ai_presence_workshop
      device_class: occupancy
      state: "{{ is_state('binary_sensor.fp2_presence_sensor_workshop', 'on') }}"
      availability: "{{ states('binary_sensor.fp2_presence_sensor_workshop') not in ['unknown', 'unavailable'] }}"
      delay_on:
        seconds: 5
      delay_off:
        seconds: 60

    - name: "AI Presence Living Room"
