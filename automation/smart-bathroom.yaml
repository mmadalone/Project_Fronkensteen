blueprint:
  name: "🚽💡 Smart Bathroom Occupancy Light (multi-zone, dropout-proof)"
  author: Murat Çeşmecioğlu (modified by Madalone & Miquel)
  description: '![Image](https://raw.githubusercontent.com/mmadalone/Project_Fronkensteen/main/images/header/smart-bathroom-header.jpeg)

    # Smart Bathroom Occupancy Light Control

    Occupancy-aware bathroom light built to survive flaky mmWave presence
    sensors (e.g. Aqara FP2) that briefly drop presence while you are still in
    the room. Occupancy = the logical OR of every configured presence zone
    (primary + optional shower + optional extra zones). The light turns ON the
    instant ANY zone reports presence, and only turns OFF once ALL zones have
    been continuously clear for the configurable grace period — so momentary
    radar dropouts never kill the light mid-use. Optional door welcome, daylight
    (lux) gate, light-appearance overrides, and a safety max-on cap. Every
    behavioural value is an exposed input — nothing is hardcoded.

    ### Recent changes

    - **v7:** Rewrite — occupancy = OR(primary, shower, extra zones); single
      grace-period off via template trigger `for:` that auto-resets on any
      dropout pulse (rides out FP2 false-offs); mode: restart; collapsed the
      7-branch state machine to 3 branches. New inputs: extra_presence_sensors,
      presence_grace, on_confirm_delay, safety_max_on, light-appearance
      overrides (brightness/color temp/transition), daylight lux gate,
      welcome_on_door. All prior input keys preserved (instances migrate with no
      edits); helper is now an optional status mirror; delay_before_motion_check
      and exit_wait_timeout retained as legacy/no-op. Zero hardcoded values.

    - **v6:** AP-08 audit exemption note (accepted complexity), Branch 6 continue_on_error consistency fix

    - **v5:** Added continue_on_error on paired light actions (6 locations), source_url, shower zone debounce (5s), sequential branch renumbering

    - **v4:** Fixed AP-44 default values (collapsible sections), added motion pre-check to Branch 5 exit (AP-20)

    - **v3:** Fixed stale variable race condition, consolidated choose blocks, inlined state checks

    - **v2:** Full style guide compliance — modern syntax, timeouts, aliases, collapsible inputs

    - **v1:** Initial version (Murat Çeşmecioğlu, modified by Madalone)'
  domain: automation
  source_url: "https://github.com/mmadalone/Project_Fronkensteen/blob/main/automation/smart-bathroom.yaml"
  homeassistant:
    min_version: "2024.10.0"

  input:
    # ===========================================================================
    # ① SENSORS & DETECTION
    # ===========================================================================
    sensors:
      name: "① Sensors & detection"
      icon: mdi:motion-sensor
      collapsed: false
      description: >-
        Configure the presence zones (occupancy = OR of all of them), plus
        optional door and shower sensors.
      input:
        motion_sensor:
          name: Primary presence sensor
          description: >-
            Main motion/occupancy sensor for the bathroom (e.g. the Aqara FP2
            bathroom zone). Detects entry and ongoing presence.
          selector:
            entity:
              domain:
                - binary_sensor
              multiple: false
          default: ""

        extra_presence_sensors:
          name: Extra presence zones (optional)
          description: >-
            Additional presence zones to OR into occupancy (e.g. FP2 sink/toilet
            zones). ANY of these being "on" keeps the room occupied. Leave empty
            if you only have one zone.
          default: []
          selector:
            entity:
              domain:
                - binary_sensor
              multiple: true

        use_shower_zone:
          name: Use Shower Zone Sensor?
          description: >-
            Enable if you have a dedicated presence zone covering the shower
            (e.g. an Aqara FP2 shower zone). It is OR-ed into occupancy so the
            light stays on while showering behind a glass door.
          default: false
          selector:
            boolean: {}

        shower_zone_sensor:
          name: Shower Zone Sensor
          description: >-
            Presence zone sensor for the shower area. Only evaluated when
            "Use Shower Zone Sensor?" is enabled — safe to leave empty
            if disabled.
          default: ""
          selector:
            entity:
              domain:
                - binary_sensor
              device_class:
                - occupancy
                - presence
                - motion
              multiple: false

        use_door_sensor:
          name: Use Door Sensor?
          description: >-
            Enable if you have a door/contact sensor. When off, door state
            is ignored in all logic.
          default: false
          selector:
            boolean: {}

        door_sensor:
          name: Door Sensor
          description: >-
            Door/contact sensor entity. Only evaluated when "Use Door Sensor?"
            is enabled — safe to leave empty if disabled.
          default: ""
          selector:
            entity:
              domain:
                - binary_sensor
              device_class:
                - door
                - opening
              multiple: false

    # ===========================================================================
    # ② LIGHTS & HELPER
    # ===========================================================================
    lights_helpers:
      name: "② Lights & helper"
      icon: mdi:lightbulb-outline
      collapsed: true
      description: Target light/switch and the optional occupancy status helper.
      input:
        light_entity:
          name: Bathroom Light
          description: >-
            The light (or switch/input_boolean) to control. Turned on when
            occupancy is detected, off when the room empties.
          default: ""
          selector:
            entity:
              filter:
                - domain:
                    - light
                    - switch
                    - input_boolean
              multiple: false

        helper_entity:
          name: Occupancy Helper (optional)
          description: >-
            Optional input_boolean that mirrors whether the bathroom is occupied
            (handy for other automations/dashboards). The light logic no longer
            depends on it — leave blank to disable mirroring.
          default: ""
          selector:
            entity:
              domain:
                - input_boolean
              multiple: false

    # ===========================================================================
    # ③ LIGHT APPEARANCE (only applies when the target is a light)
    # ===========================================================================
    appearance:
      name: "③ Light appearance"
      icon: mdi:brightness-6
      collapsed: true
      description: >-
        Optional on/off appearance overrides. Only applied when the target is a
        light entity; switches/input_booleans ignore them. Leave at 0 to use the
        device default (plain on/off).
      input:
        turn_on_brightness_pct:
          name: Turn-on brightness (%)
          description: "Brightness to set on turn-on. 0 = don't set (device default)."
          default: 0
          selector:
            number:
              min: 0
              max: 100
              step: 1
              unit_of_measurement: "%"
              mode: slider

        turn_on_color_temp_kelvin:
          name: Turn-on color temperature (K)
          description: "Color temperature to set on turn-on. 0 = don't set."
          default: 0
          selector:
            number:
              min: 0
              max: 6500
              step: 50
              unit_of_measurement: K
              mode: slider

        on_transition:
          name: On transition (s)
          description: "Fade-in time on turn-on. 0 = instant."
          default: 0
          selector:
            number:
              min: 0
              max: 30
              step: 1
              unit_of_measurement: s
              mode: slider

        off_transition:
          name: Off transition (s)
          description: "Fade-out time on turn-off. 0 = instant."
          default: 0
          selector:
            number:
              min: 0
              max: 30
              step: 1
              unit_of_measurement: s
              mode: slider

    # ===========================================================================
    # ④ TIMING
    # ===========================================================================
    timing:
      name: "④ Timing"
      icon: mdi:clock-outline
      collapsed: true
      description: Grace period, on-confirm delay, and safety cap.
      input:
        presence_grace:
          name: Occupancy Grace Period
          description: >-
            How long ALL presence zones must stay continuously clear before the
            room is treated as empty and the light turns off. Set this LONGER
            than your sensor's worst-case presence dropout (the Aqara FP2 can
            drop to "off" for ~5 min while you are still present). Default 360s
            (6 min). Each presence pulse resets this timer, so dropouts never
            trigger an off.
          default: 360
          selector:
            number:
              min: 30
              max: 900
              step: 10
              unit_of_measurement: s
              mode: slider

        on_confirm_delay:
          name: On-confirm Delay
          description: >-
            How long presence must persist before turning the light on. 0 =
            instant (recommended for a bathroom). Raise slightly only if a single
            stray pulse falsely turns the light on.
          default: 0
          selector:
            number:
              min: 0
              max: 60
              step: 1
              unit_of_measurement: s
              mode: slider

        safety_max_on:
          name: Safety Max-on Cap
          description: >-
            Failsafe: force the light off after it has been on continuously for
            this long, even if presence appears stuck on. 0 = disabled.
          default: 0
          selector:
            number:
              min: 0
              max: 240
              step: 5
              unit_of_measurement: min
              mode: slider

        delay_before_motion_check:
          name: "Motion Sensor Delay (legacy — unused)"
          description: >-
            Legacy input retained for backward compatibility. No longer used —
            superseded by the Occupancy Grace Period.
          default: 2
          selector:
            number:
              min: 0
              max: 60
              step: 1
              unit_of_measurement: s
              mode: slider

        exit_wait_timeout:
          name: "Exit Wait Timeout (legacy — unused)"
          description: >-
            Legacy input retained for backward compatibility. No longer used —
            superseded by the Occupancy Grace Period.
          default: 30
          selector:
            number:
              min: 5
              max: 120
              step: 5
              unit_of_measurement: min
              mode: slider

    # ===========================================================================
    # ⑤ DAYLIGHT GATE (optional)
    # ===========================================================================
    daylight:
      name: "⑤ Daylight gate"
      icon: mdi:white-balance-sunny
      collapsed: true
      description: >-
        Optionally only auto-turn-on when the room is dark. Never blocks turn-off,
        and fails open (turns on anyway) if the lux sensor is unavailable.
      input:
        use_lux_gate:
          name: Use daylight (lux) gate?
          description: Only turn the light on when measured illuminance is below the threshold.
          default: false
          selector:
            boolean: {}

        lux_sensor:
          name: Illuminance sensor
          description: >-
            Lux sensor used for the daylight gate (e.g. the FP2 light-level
            sensor). Only evaluated when the gate is enabled.
          default: ""
          selector:
            entity:
              domain:
                - sensor
              device_class:
                - illuminance
              multiple: false

        lux_threshold:
          name: Lux threshold
          description: "Only turn on when illuminance is below this value (lx)."
          default: 30
          selector:
            number:
              min: 0
              max: 1000
              step: 5
              unit_of_measurement: lx
              mode: slider

    # ===========================================================================
    # ⑥ BEHAVIOR
    # ===========================================================================
    behavior:
      name: "⑥ Behavior"
      icon: mdi:tune
      collapsed: true
      description: Optional behavioral toggles.
      input:
        welcome_on_door:
          name: Welcome light on door open
          description: >-
            When a door sensor is enabled, turn the light on the moment the door
            opens while the room is empty (before the radar catches you).
          default: true
          selector:
            boolean: {}

# mode: restart is an invariant — a new presence event must pre-empt any in-flight
# run; the grace lives in the trigger layer so this never resets the off-timer.
mode: restart
max_exceeded: silent

trigger_variables:
  primary: !input motion_sensor
  has_shower: !input use_shower_zone
  shower: !input shower_zone_sensor
  extras: !input extra_presence_sensors
  has_door: !input use_door_sensor
  door: !input door_sensor
  safety_minutes: !input safety_max_on

variables:
  primary: !input motion_sensor
  has_shower: !input use_shower_zone
  shower: !input shower_zone_sensor
  extras: !input extra_presence_sensors
  has_door: !input use_door_sensor
  door: !input door_sensor
  light: !input light_entity
  helper: !input helper_entity
  br: !input turn_on_brightness_pct
  ctk: !input turn_on_color_temp_kelvin
  on_tr: !input on_transition
  off_tr: !input off_transition
  use_lux: !input use_lux_gate
  lux: !input lux_sensor
  lux_threshold: !input lux_threshold
  welcome_door: !input welcome_on_door
  safety_minutes: !input safety_max_on
  is_light: "{{ (light | string).startswith('light.') }}"
  helper_set: "{{ helper not in [none, '', {}] }}"
  any_present: >-
    {{ (([primary] if primary not in [none, '', {}] else [])
        + ([shower] if (has_shower and shower not in [none, '', {}]) else [])
        + (extras if (extras is iterable and extras is not string) else []))
       | select('is_state', 'on') | list | count > 0 }}
  on_appearance_set: >-
    {{ is_light and ((br | int(0)) > 0 or (ctk | int(0)) > 0 or (on_tr | int(0)) > 0) }}
  off_appearance_set: "{{ is_light and (off_tr | int(0)) > 0 }}"
  on_service: "{{ 'light.turn_on' if on_appearance_set else 'homeassistant.turn_on' }}"
  off_service: "{{ 'light.turn_off' if off_appearance_set else 'homeassistant.turn_off' }}"
  turn_on_data: >-
    {{ ({}
        | combine({'brightness_pct': (br | int)} if (br | int(0)) > 0 else {})
        | combine({'color_temp_kelvin': (ctk | int)} if (ctk | int(0)) > 0 else {})
        | combine({'transition': (on_tr | int)} if (on_tr | int(0)) > 0 else {})) if is_light else {} }}
  turn_off_data: "{{ {'transition': (off_tr | int)} if off_appearance_set else {} }}"
  lux_ok: >-
    {{ (not use_lux)
       or (lux in [none, '', {}])
       or (states(lux) in ['unknown', 'unavailable'])
       or ((states(lux) | float(0)) < (lux_threshold | float(0))) }}

triggers:
  - alias: "Presence detected in any configured zone — turn on"
    trigger: template
    id: presence_on
    value_template: >-
      {{ (([primary] if primary not in [none, '', {}] else [])
          + ([shower] if (has_shower and shower not in [none, '', {}]) else [])
          + (extras if (extras is iterable and extras is not string) else []))
         | select('is_state', 'on') | list | count > 0 }}
    for:
      seconds: !input on_confirm_delay

  - alias: "Primary zone on (state trigger — guarantees entity tracking)"
    trigger: state
    entity_id: !input motion_sensor
    to: "on"
    for:
      seconds: !input on_confirm_delay
    id: presence_on

  - alias: "All presence zones clear for the grace period — turn off (the fix)"
    trigger: template
    id: all_clear
    value_template: >-
      {{ (([primary] if primary not in [none, '', {}] else [])
          + ([shower] if (has_shower and shower not in [none, '', {}]) else [])
          + (extras if (extras is iterable and extras is not string) else []))
         | select('is_state', 'on') | list | count == 0 }}
    for:
      seconds: !input presence_grace

  - alias: "Door opened — welcome light (only active when door enabled)"
    trigger: template
    id: door_opened
    value_template: >-
      {{ has_door and door not in [none, '', {}] and is_state(door, 'on') }}

  - alias: "Light on past the safety cap — force off (disabled when cap = 0)"
    trigger: state
    entity_id: !input light_entity
    to: "on"
    for:
      minutes: "{{ safety_minutes if (safety_minutes | int(0)) > 0 else 100000 }}"
    id: safety_cap

conditions: []

actions:
  - alias: "Route by trigger id"
    choose:
      # ── Turn ON: any presence detected, or welcome-on-door while empty ──────
      - alias: "Turn light ON (presence, or door welcome while empty)"
        conditions:
          - condition: template
            value_template: >-
              {{ (trigger.id == 'presence_on')
                 or (trigger.id == 'door_opened' and welcome_door and not any_present) }}
          - condition: template
            value_template: "{{ not is_state(light, 'on') }}"
          - condition: template
            value_template: "{{ lux_ok }}"
        sequence:
          - alias: "Turn on bathroom light (appearance-aware service + data)"
            action: "{{ on_service }}"
            target:
              entity_id: !input light_entity
            data: "{{ turn_on_data }}"
            continue_on_error: true
          - alias: "Mirror occupancy helper on (optional)"
            if:
              - condition: template
                value_template: "{{ helper_set }}"
            then:
              - action: input_boolean.turn_on
                target:
                  entity_id: !input helper_entity

      # ── Turn OFF: all zones clear for the full grace period ─────────────────
      - alias: "Turn light OFF — room truly empty (all zones clear for grace)"
        conditions:
          - condition: trigger
            id: all_clear
          - condition: template
            value_template: "{{ not any_present }}"
        sequence:
          - alias: "Turn off bathroom light (appearance-aware service + data)"
            action: "{{ off_service }}"
            target:
              entity_id: !input light_entity
            data: "{{ turn_off_data }}"
            continue_on_error: true
          - alias: "Mirror occupancy helper off (optional)"
            if:
              - condition: template
                value_template: "{{ helper_set }}"
            then:
              - action: input_boolean.turn_off
                target:
                  entity_id: !input helper_entity

      # ── Safety cap: force off after max-on time ─────────────────────────────
      - alias: "Safety cap — light on too long, force off"
        conditions:
          - condition: trigger
            id: safety_cap
          - condition: template
            value_template: "{{ (safety_minutes | int(0)) > 0 }}"
        sequence:
          - alias: "Force off bathroom light — safety cap exceeded"
            action: "{{ off_service }}"
            target:
              entity_id: !input light_entity
            data: "{{ turn_off_data }}"
            continue_on_error: true
          - alias: "Mirror occupancy helper off — safety cap"
            if:
              - condition: template
                value_template: "{{ helper_set }}"
            then:
              - action: input_boolean.turn_off
                target:
                  entity_id: !input helper_entity

    default:
      - alias: "No matching branch — no action needed"
        stop: "No branch matched the current trigger + state combination."
