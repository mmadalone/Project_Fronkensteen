blueprint:
  name: Music Assistant – Follow me (multi-room advanced)
  author: madalone
  description: >
    ![Image](https://raw.githubusercontent.com/mmadalone/Project_Fronkensteen/main/images/header/music_assistant_follow_me_multi_room_advanced-header.jpeg)

    # Music Assistant – Follow me (multi-room advanced)

    Presence-driven follow-me for Music Assistant queues across multiple zones.
    Transfers the active queue to whichever room you walk into, with priority
    ordering, anti-flicker, cooldown, playback protection, optional announcements,
    and a TTS duration filter to ignore short clips.

    ### Recent changes

    - **v16:** Reverse transfer + seek toggle. `empty_house_action` turns the empty-house behaviour into a choice: `pause` (unchanged) or `handover_to_phone`, which moves the Spotify session to your phone so it leaves with you. The phone is resolved by NAME at runtime (`empty_house_phone_device`), because Spotify regenerates device IDs. Handover is **paused by default** (`empty_house_autoplay: false`) so music does not start in your pocket; if the handover fails the existing pause still runs, so the house is never left playing to nobody. Also `ma_target_seek` (default **off**) — Music Assistant serves Spotify as a duration-less stream and logs that seeking is not possible on it, and a Voice PE crashed shortly after one such seek (never proven to be the cause, hence a setting rather than a removal). Cost of off: MA targets restart the track. Spotify Connect targets are unaffected and always preserve position.

  domain: automation
  source_url: "https://github.com/mmadalone/Project_Fronkensteen/blob/main/automation/music_assistant_follow_me_multi_room_advanced.yaml"
  homeassistant:
    min_version: "2024.10.0"

  input:
    # ===========================================================================
    # ① CORE SETUP
    # ===========================================================================
    core_setup:
      name: "① Core setup"
      icon: mdi:music-note-bluetooth
      collapsed: false
      description: Follow-me toggle and paired presence-sensor / player lists.
      input:
        follow_switch:
          name: Follow music toggle
          description: >
            Global on/off switch for this follow-me logic.
          selector:
            entity:
              domain: input_boolean
          default: ""

        presence_sensors:
          name: Presence sensors (priority order, first = highest)
          description: >
            Binary sensors that indicate someone is in a zone.
            The order here defines the zone priority (0 = highest).
          selector:
            entity:
              domain: binary_sensor
              multiple: true
          default: ""

        target_players:
          name: Music Assistant players (same order as sensors)
          description: >
            Music Assistant media_player entities, in the exact same order
            as the presence sensors above.
          selector:
            entity:
              filter:
                - integration: music_assistant
                  domain:
                    - media_player
              multiple: true
          default: ""

        tts_pre_players:
          name: TTS players for pre-transfer announcements (same order as sensors)
          description: >
            Physical hardware media_player entities used for TTS announcements
            BEFORE the queue transfer, in the exact same order as the presence
            sensors above. Pick speakers that are NOT the target of the incoming
            queue transfer to avoid TTS colliding with music playback. If left
            empty, the automation falls back to the MA target_player (not
            recommended with Voice PE hardware).
          default: []
          selector:
            entity:
              domain: media_player
              multiple: true

        tts_post_players:
          name: TTS players for post-transfer announcements (same order as sensors)
          description: >
            Physical hardware media_player entities used for TTS announcements
            AFTER the queue transfer, in the exact same order as the presence
            sensors above. Pick speakers in the destination room so the
            announcement plays where you are. If left empty, the automation
            falls back to the MA target_player (not recommended with Voice PE
            hardware).
          default: []
          selector:
            entity:
              domain: media_player
              multiple: true

    # ===========================================================================
    # ② PERSONS GATE
    # ===========================================================================
    persons_gate:
      name: "② Persons gate"
      icon: mdi:account-check
      collapsed: true
      description: Optionally restrict follow-me to when specific persons are home.
      input:
        person_required:
          name: Require persons to be home
          description: >
            If enabled, the automation only runs when at least one of the selected
            persons below is home.
          default: false
          selector:
            boolean: {}

        persons:
          name: Persons (optional)
          description: >
            Optional persons that must be home when "Require persons" is enabled.
            If left empty and "Require persons" is ON, the person condition will
            always fail (no follow).
          default: []
          selector:
            entity:
              domain: person
              multiple: true

    # ===========================================================================
    # ③ PLAYBACK FILTERS
    # ===========================================================================
    playback_filters:
      name: "③ Playback filters"
      icon: mdi:clipboard-play
      collapsed: true
      description: >
        Control when follow-me runs based on what's currently playing,
        source restrictions, and target protection.
      input:
        only_follow_when_playing:
          name: Only follow when music is playing
          description: >
            If enabled, follow-me only runs when at least one of the configured
            players is actually in the "playing" state (or "paused" if
            follow-paused-music is also enabled). If everything is idle
            (or only short TTS is playing), no transfer happens and no
            announcements are made.
          default: true
          selector:
            boolean: {}

        follow_paused_music:
          name: Follow paused music
          description: >
            If enabled, paused music sessions are also eligible for follow-me
            transfers. The queue will be moved to your new room but will NOT
            auto-play — it stays paused on the target player so you can resume
            manually. Only effective when "Only follow when playing" is enabled.
          default: false
          selector:
            boolean: {}

        min_music_duration_seconds:
          name: Minimum media duration to treat as music
          description: >
            When deciding if "music is playing", ignore playback shorter than this
            many seconds (useful to ignore short TTS clips). Streams or unknown
            duration (0) are always treated as music.
          default: 20
          selector:
            number:
              min: 0
              max: 600
              unit_of_measurement: s
              mode: slider

        treat_unknown_duration_as_music:
          name: Treat unknown duration as music
          description: >
            If enabled, players with media_duration 0 are treated as music sessions
            (good for radio streams but may also count TTS as music). If disabled,
            media_duration 0 will be ignored for "music playing" checks.
          default: true
          selector:
            boolean: {}

        protect_target_playback:
          name: Skip transfer if target is already playing
          description: >
            If enabled, the automation skips follow-me when the target player is
            already actively playing something (playing/buffering). This prevents
            hijacking an existing session in the room you move into.
          default: true
          selector:
            boolean: {}

        skip_if_source_occupied:
          name: Skip transfer if source room is still occupied
          description: >
            If enabled, the automation will not transfer music away from a room
            that still has presence. This prevents "stealing" music from another
            person who is still listening in that room. Music only follows when
            the source room becomes empty. Combined with "Skip transfer if target
            is already playing", this provides natural multi-person coexistence —
            independent listening sessions are never hijacked.
          default: true
          selector:
            boolean: {}

        allowed_source_players:
          name: Allowed source players (optional)
          description: >
            Optional allow-list of players that may act as SOURCE for follow-me.
            When this list is empty, any player in the configured target list may
            be used as a source. When not empty, follow-me will only move queues
            that currently live on one of these players.
          default: []
          selector:
            entity:
              filter:
                - integration: music_assistant
                  domain:
                    - media_player
              multiple: true

        excluded_source_players:
          name: Excluded source players (blacklist, optional)
          description: >
            Optional block-list of players that must NEVER act as source for
            follow-me. If the current music source matches any player in this
            list, the transfer is blocked entirely. Useful for excluding TV
            players (e.g. madteevee) or other devices whose playback should
            never be moved. This filter is applied AFTER the allowed source
            players whitelist.
          default: []
          selector:
            entity:
              filter:
                - integration: music_assistant
                  domain:
                    - media_player
              multiple: true

        silence_other_players:
          name: Silence other players after transfer (exclusive room)
          description: >
            If enabled, all configured MA players except the transfer target
            are stopped after a successful queue transfer. Ensures only one
            room plays at a time. Only affects players currently in the
            "playing" or "buffering" state — paused sessions are preserved.
          default: false
          selector:
            boolean: {}

    # ===========================================================================
    # ④ PRIORITY & TIMING
    # ===========================================================================
    priority_timing:
      name: "④ Priority & timing"
      icon: mdi:timer-cog
      collapsed: true
      description: >
        Priority anchoring, anti-flicker, transfer delay, and cooldown between transfers.
      input:
        enforce_priority_anchor:
          name: Enforce priority anchor
          description: >
            If enabled, music will not be moved from a higher-priority zone to a
            lower-priority zone while the higher-priority zone still has presence.
            Moving from low → high is always allowed.
          default: false
          selector:
            boolean: {}

        min_presence_on_time:
          name: Minimum zone presence time before follow
          description: >
            Minimum duration a presence sensor must stay ON before it can trigger
            follow-me. Set to 0 to trigger immediately when the sensor turns ON.
          default:
            seconds: 0
          selector:
            duration: {}

        stop_when_all_empty:
          name: Stop music when every room is empty (optional)
          description: >
            When ON, music is paused once ALL configured presence sensors are
            clear — i.e. you have left the house or gone somewhere without a
            sensor. Moving between rooms is unaffected: the destination sensor
            turns ON and a normal transfer happens instead.


            Default OFF, so existing automations keep their current behaviour
            of leaving music playing in the last room.
          default: false
          selector:
            boolean: {}

        empty_house_action:
          name: What to do when every room is empty
          description: >
            `pause` simply stops the music (original behaviour).


            `handover_to_phone` instead moves the Spotify session to your phone
            so it leaves the house with you. Needs "Phone Spotify device name"
            below. Falls back to pausing if the phone is not reachable.
          default: pause
          selector:
            select:
              options:
                - pause
                - handover_to_phone

        empty_house_phone_device:
          name: Phone Spotify device name (optional)
          description: >
            The phone's name as Spotify shows it, e.g. `Madaphone`. Resolved at
            runtime rather than stored as an ID, because Spotify regenerates
            device IDs.


            Only used when the action above is `handover_to_phone`.
          default: ""
          selector:
            text:

        empty_house_autoplay:
          name: Start playing on the phone
          description: >
            Off by default: the session is handed over PAUSED so music does not
            suddenly start in your pocket as you leave. Turn on to have it keep
            playing straight through the handover.
          default: false
          selector:
            boolean: {}

        empty_grace_period:
          name: Grace period before stopping
          description: >
            How long every sensor must stay clear before music is paused.
            Guards against FP2 sensors briefly dropping while you are still in
            the room. Re-checked after the wait — if anyone is detected again,
            nothing is stopped.
          default:
            minutes: 2
          selector:
            duration: {}

        delay_seconds:
          name: Delay before transfer (seconds)
          description: >
            Optional delay between the pre-transfer announcement (if any) and
            transferring the queue. Set to 0 for immediate transfer after the
            pre-announcement.
          default: 0
          selector:
            number:
              min: 0
              max: 600
              unit_of_measurement: s
              mode: slider

        cooldown_seconds:
          name: Global cooldown after successful transfer (seconds)
          description: >
            Minimum time between successful queue transfers. Requires the helper
            below. Set to 0 to disable cooldown.
          default: 0
          selector:
            number:
              min: 0
              max: 3600
              unit_of_measurement: s
              mode: slider

        cooldown_helper:
          name: Cooldown helper (input_datetime, optional)
          description: >
            Input_datetime entity used to remember the time of the last successful
            queue transfer. It must have both date and time. If omitted or if
            cooldown_seconds is 0, the cooldown check is skipped.
          default: ""
          selector:
            entity:
              domain: input_datetime
              multiple: false

        post_transfer_settle_seconds:
          name: Post-transfer settling delay (seconds)
          description: >
            Time to wait after the Music Assistant queue transfer before checking
            whether the transfer succeeded. Gives MA time to propagate state to
            the target player. Increase this if you see false-negative transfer
            detections (e.g. with Spotify or slow backends).
          default: 2
          selector:
            number:
              min: 0
              max: 300
              unit_of_measurement: s
              mode: slider

    # ===========================================================================
    # ⑤ ANNOUNCEMENTS
    # ===========================================================================
    announcements:
      name: "⑤ Announcements"
      icon: mdi:bullhorn
      collapsed: true
      description: Optional scripts to run before and/or after a queue transfer.
      input:
        pre_announcements_enabled:
          name: Run pre-transfer announcement script
          description: >
            If enabled, the automation will call the selected script BEFORE
            moving the queue, passing "target_player" and "source_player" as
            variables. The script can e.g. speak on the target player before
            the music starts there.
          default: false
          selector:
            boolean: {}

        pre_announcement_script:
          name: Pre-transfer announcement script (optional)
          description: >
            Script to call before a successful queue transfer. It will receive
            variables "target_player" and "source_player".
            Example: script.announce_music_follow_me_tts_llm_driven
          default: ""
          selector:
            entity:
              domain: script
              multiple: false

        announcements_enabled:
          name: Run post-transfer announcement script
          description: >
            If enabled, the automation will call the selected script AFTER
            moving the queue, passing "target_player" and "source_player"
            as variables.
          default: true
          selector:
            boolean: {}

        announcement_script:
          name: Post-transfer announcement script (optional)
          description: >
            Script to call after a successful queue transfer. It will receive
            variables "target_player" and "source_player".
            Example: script.announce_music_follow_me_tts_llm_driven
          default: ""
          selector:
            entity:
              domain: script
              multiple: false

        announce_transfer_failure:
          name: Announce transfer failures
          description: >
            If enabled, the post-transfer announcement script is called with
            failure context (transfer_failed: true, failure_reason) when the
            queue transfer fails. The script or its LLM agent can then speak
            a human-friendly error message instead of a success announcement.
            Requires a post-transfer announcement script to be configured.
          default: true
          selector:
            boolean: {}

    # ===========================================================================
    # ⑥ SAFETY
    # ===========================================================================
    safety:
      name: "⑥ Safety"
      icon: mdi:shield-check
      collapsed: true
      description: Guards to prevent follow-me from interfering with voice interactions.
      input:
        voice_assistant_guard:
          name: Block while voice assistant is active (optional)
          description: >
            Optional helper (for example input_boolean.voice_pe_ducking_active)
            that is turned ON while your voice assistant / TTS is speaking.
            When this is ON, follow-me does nothing.
          default: ""
          selector:
            entity:
              domain:
                - input_boolean
                - binary_sensor
              multiple: false

    # ===========================================================================
    # ⑦ SPOTIFY CONNECT
    # ===========================================================================
    spotify_connect:
      name: "⑦ Spotify Connect transfer"
      icon: mdi:spotify
      collapsed: true
      description: >
        Optional. Move a live Spotify Connect session between speakers instead
        of transferring a Music Assistant queue.


        Use this when music is started on an Echo/Alexa that plays out through a
        Spotify Connect speaker (Sonos). Music Assistant only *mirrors* such a
        session and cannot move it, but SpotifyPlus can hand the session to
        another Connect device.


        Leave everything here empty to keep the original Music Assistant
        behaviour — existing automations are unaffected.
      input:
        spotifyplus_entity:
          name: SpotifyPlus media player (optional)
          description: >
            The SpotifyPlus media_player entity for your account. Required for
            the Spotify Connect backend. Leave empty to disable it entirely.
          default: ""
          selector:
            entity:
              domain: media_player
              multiple: false

        transfer_backend_list:
          name: Transfer backend per room (optional)
          description: >
            Parallel array to "Presence sensors" — one entry per sensor, same
            order:


            • `spotify_connect` — the room's speaker IS a Spotify Connect
            device (e.g. Sonos). Needs its 40-char device ID below.


            • `ma_spotify` — the room's speaker is a Music Assistant player
            that is NOT a Connect endpoint (e.g. an ESPHome Voice PE). MA
            streams the tracks itself. Requires MA >= 2.9.13.


            • `ma_native` — original behaviour, transfers a Music Assistant
            queue. Note this cannot move a session that MA is only
            *mirroring* (an Alexa-driven Sonos has no MA queue to transfer).


            Both Spotify backends fall back to `ma_native` automatically when
            no live Spotify session exists, so radio and local-library
            playback are unaffected.


            Leave empty to use `ma_native` for every room.
          default: []
          selector:
            select:
              multiple: true
              custom_value: true
              options:
                - ma_native
                - spotify_connect
                - ma_spotify

        ma_target_seek:
          name: Seek to original position on Music Assistant targets
          description: >
            Off by default. Music Assistant serves Spotify as a duration-less
            stream and logs that seeking is not possible on it; a Voice PE also
            crashed shortly after one such seek (never proven to be the cause,
            which is why this is a setting rather than a removal).


            Cost of leaving it off: Music Assistant targets restart the track
            from the beginning instead of continuing where you were.
            Spotify Connect targets (Sonos) always preserve position — this
            setting does not affect them.
          default: false
          selector:
            boolean: {}

        spotify_connect_device_ids:
          name: Spotify Connect device IDs (optional)
          description: >
            Parallel array to "Presence sensors" — one entry per sensor, same
            order. The 40-character Spotify Connect device ID of that room's
            speaker. Use an empty string for `ma_native` rooms.


            Get them from the `spotifyplus.get_spotify_connect_devices` service
            response. IDs are 40 characters for Sonos — do not truncate them.
          default: []
          selector:
            text:
              multiple: true

    # ===========================================================================
    # ⑧ ARRIVAL (phone → home)
    # ===========================================================================
    arrival:
      name: "⑧ Arrival — continue phone music at home"
      icon: mdi:home-import-outline
      collapsed: true
      description: >
        Optional. When you arrive home with music playing on your phone, move it
        to whichever room you walk into.


        Arrival is confirmed by three signals: the person entity (which Home
        Assistant already computes from BOTH your WiFi/router tracker and your
        GPS tracker), plus an FP2 presence sensor claiming a room. At the front
        door no room sensor has fired yet, so the automation waits for one.


        Leave "Arrival persons" empty to disable this entirely — existing
        automations are unaffected.
      input:
        arrival_persons:
          name: Arrival persons (optional)
          description: >
            Person entities to watch for not_home → home. Empty disables arrival
            handling.


            NOTE: this relies on the person entity having BOTH a WiFi/router
            device_tracker and a GPS device_tracker attached. A non-GPS tracker
            reporting "home" outranks a GPS tracker reporting "not_home", which
            is what makes this reliable indoors.
          default: []
          selector:
            entity:
              domain: person
              multiple: true

        arrival_source_players:
          name: Phone media players (optional)
          description: >
            Music Assistant players that represent your phone. Needed because
            the normal source scan only looks at the target players, which never
            include the phone.


            These register only while the Music Assistant app is open, so they
            are often absent — that is expected and handled.


            Not needed for Spotify: a Spotify session on the phone is detected
            through the SpotifyPlus entity instead.
          default: []
          selector:
            entity:
              domain: media_player
              multiple: true

        arrival_phone_media_sensor:
          name: Phone media session sensor (optional)
          description: >
            The Home Assistant companion app's "Media session" sensor, e.g.
            `sensor.<phone>_media_session`. When set, arrival only proceeds if
            it reports Playing or Buffering — so walking in to silence does
            nothing at all.


            Its attributes are namespaced per app
            (`playback_state_com.spotify.music`,
            `title_io.music_assistant.client`, …), which also lets the
            automation tell WHICH app is playing instead of guessing. It even
            carries the Spotify track URI in `media_id_com.spotify.music`.


            Leave empty to skip this check.
          default: ""
          selector:
            entity:
              domain: sensor
              multiple: false

        arrival_spotify_package:
          name: Spotify app package
          description: >
            Android package name for Spotify, used to read the per-app
            attributes on the media session sensor.
          default: com.spotify.music
          selector:
            text:

        arrival_ma_package:
          name: Music Assistant app package
          description: >
            Android package name for the Music Assistant companion app. When
            THIS app is the one playing, the queue is moved by asking the
            Music Assistant server directly, because HA has no entity for the
            phone's MA player.
          default: io.music_assistant.client
          selector:
            text:

        arrival_wait_timeout:
          name: Wait for a room to claim you
          description: >
            How long to wait after arriving for a presence sensor to turn on.
            If nothing does, nothing is transferred and nothing is announced.
          default:
            minutes: 3
          selector:
            duration: {}

        arrival_cooldown_seconds:
          name: Arrival cooldown (seconds)
          description: >
            Ignore repeat arrivals within this window. Guards against GPS
            bouncing between home and not_home.
          default: 900
          selector:
            number:
              min: 0
              max: 7200
              step: 30
              unit_of_measurement: seconds
              mode: box

mode: restart
max_exceeded: silent

variables:
  presence_list: !input presence_sensors
  player_list: !input target_players
  arrival_person_list: !input arrival_persons
  arrival_source_list: !input arrival_source_players
  arrival_media_sensor: !input arrival_phone_media_sensor
  arrival_spotify_pkg: !input arrival_spotify_package
  arrival_ma_pkg: !input arrival_ma_package
  arrival_wait_timeout_value: !input arrival_wait_timeout
  arrival_cooldown_value: !input arrival_cooldown_seconds
  stop_when_all_empty_flag: !input stop_when_all_empty
  empty_house_action_value: !input empty_house_action
  empty_house_phone_device_value: !input empty_house_phone_device
  empty_house_autoplay_flag: !input empty_house_autoplay
  ma_seek_flag: !input ma_target_seek
  empty_grace_period_value: !input empty_grace_period
  spotifyplus_entity_id: !input spotifyplus_entity
  transfer_backend_list_raw: !input transfer_backend_list
  spotify_device_id_list: !input spotify_connect_device_ids
  tts_pre_player_list: !input tts_pre_players
  tts_post_player_list: !input tts_post_players
  person_list: !input persons
  require_person: !input person_required
  allowed_source_players_list: !input allowed_source_players
  excluded_source_players_list: !input excluded_source_players
  enforce_priority_anchor_flag: !input enforce_priority_anchor
  delay_seconds_value: !input delay_seconds

  cooldown_seconds_value: !input cooldown_seconds
  cooldown_helper_entity: !input cooldown_helper

  pre_announcements_enabled_flag: !input pre_announcements_enabled
  pre_announcement_script_entity: !input pre_announcement_script

  announcements_enabled_flag: !input announcements_enabled
  announcement_script_entity: !input announcement_script
  announce_transfer_failure_flag: !input announce_transfer_failure

  only_follow_when_playing_flag: !input only_follow_when_playing
  follow_paused_music_flag: !input follow_paused_music
  min_music_duration_value: !input min_music_duration_seconds
  protect_target_playback_flag: !input protect_target_playback
  skip_if_source_occupied_flag: !input skip_if_source_occupied
  treat_unknown_duration_as_music_flag: !input treat_unknown_duration_as_music
  voice_assistant_guard_entity: !input voice_assistant_guard
  silence_other_players_flag: !input silence_other_players
  post_transfer_settle_seconds_value: !input post_transfer_settle_seconds

triggers:
  - alias: "Presence sensor turned ON — zone occupancy detected after minimum hold time"
    id: presence_on
    trigger: state
    entity_id: !input presence_sensors
    from: "off"
    to: "on"
    for: !input min_presence_on_time

  - alias: "Presence sensor turned OFF — source room cleared, retry blocked transfers"
    id: presence_off
    trigger: state
    entity_id: !input presence_sensors
    from: "on"
    to: "off"

  # Arrival: person goes not_home -> home. HA's person entity already merges
  # the WiFi/router tracker and the GPS tracker (a non-GPS "home" outranks a
  # GPS "not_home"), so this single trigger carries both signals. The FP2 wait
  # in the arrival branch supplies the third and tells us WHICH room.
  # No persons configured -> entity_id is empty -> this never fires.
  - alias: "Person arrived home — continue phone music indoors"
    id: person_arrived
    trigger: state
    entity_id: !input arrival_persons
    from: not_home
    to: home

  # Fires only once EVERY sensor has been clear for the whole grace period.
  # Must be a `for:` trigger, not a delay inside the action: moving between
  # rooms leaves a brief gap where no sensor is on (observed: 3 s between the
  # workshop clearing and the bathroom detecting), and a delay-then-check
  # approach grabs the run in that gap and — with mode: restart — swallows the
  # real transfer.
  - alias: "Every room clear for the grace period — nobody home"
    id: all_rooms_clear
    trigger: template
    value_template: >-
      {%- set ns = namespace(any=false) -%}
      {%- for s in presence_list -%}
        {%- if is_state(s, 'on') -%}{%- set ns.any = true -%}{%- endif -%}
      {%- endfor -%}
      {{ not ns.any }}
    for: !input empty_grace_period

conditions:
  - alias: "Global follow switch must be ON"
    condition: state
    entity_id: !input follow_switch
    state: "on"

  - alias: "Persons must be home (optional) — skipped when person gate is disabled"
    condition: template
    value_template: >
      {% if not require_person | bool %}
        true
      {% else %}
        {% set ns = namespace(home=false) %}
        {% for p in person_list %}
          {% if states(p) | default('unknown') == 'home' %}
            {% set ns.home = true %}
          {% endif %}
        {% endfor %}
        {{ ns.home }}
      {% endif %}

  - alias: "Global cooldown since last successful transfer (optional)"
    condition: template
    value_template: >
      {% set cooldown = cooldown_seconds_value | int(0) %}
      {% if cooldown == 0 or not cooldown_helper_entity %}
        true
      {% else %}
        {% set last = states(cooldown_helper_entity) | default('unknown') %}
        {% if last in ['unknown', 'unavailable', ''] %}
          true
        {% else %}
          {% set last_dt = as_datetime(last) %}
          {% if last_dt is none %}
            true
          {% else %}
            {{ (now().timestamp() - last_dt.timestamp()) >= cooldown }}
          {% endif %}
        {% endif %}
      {% endif %}

  - alias: "Block while voice assistant guard is ON (optional)"
    condition: template
    value_template: >
      {% if not voice_assistant_guard_entity %}
        true
      {% else %}
        {{ states(voice_assistant_guard_entity) | default('off') != 'on' }}
      {% endif %}

actions:
  # ---------------------------------------------------------------------------
  # ARRIVAL — must run BEFORE the resolve step.
  #
  # At the front door no FP2 sensor has fired, so target_index would resolve to
  # -1 and the automation would bail out. This waits for a room to claim you
  # first; the existing target_index logic then picks it up for free, because
  # an arrival trigger's to_state is 'home' (not 'on') and so falls into the
  # "first room with presence" branch that already exists for presence-OFF.
  # ---------------------------------------------------------------------------
  - alias: "Arrival — wait for a room to claim you, then fall through"
    if:
      - alias: "Fired by the arrival trigger"
        condition: template
        value_template: >
          {{ trigger.id is defined and trigger.id == 'person_arrived' }}
    then:
      - alias: "GPS-bounce cooldown — ignore repeat arrivals"
        condition: template
        value_template: >
          {{ (now() - (this.attributes.last_triggered
             | default(as_datetime('2000-01-01'), true))).total_seconds()
             > (arrival_cooldown_value | int(900)) }}

      - alias: "Wake SpotifyPlus — it reports 'off' while music is playing"
        if:
          - condition: template
            value_template: >
              {{ spotifyplus_entity_id | default('') | string | length > 0 }}
        then:
          - alias: "Turn on the SpotifyPlus media player"
            continue_on_error: true
            action: media_player.turn_on
            target:
              entity_id: "{{ spotifyplus_entity_id }}"
          - delay:
              seconds: 6

      # Fail fast when the phone isn't playing anything. The companion app's
      # media-session sensor is the reliable signal here: the MA player itself
      # has no HA entity, and binary_sensor.*_music_active was observed reading
      # "off" while a session was actively Playing.
      # Skipped entirely when no sensor is configured.
      - alias: "Phone must actually be playing something (if a sensor is configured)"
        condition: template
        value_template: >
          {%- set s = arrival_media_sensor | default('') | string | trim -%}
          {%- if s | length == 0 -%}
            true
          {%- else -%}
            {{ states(s) | default('unknown') in ['Playing', 'Buffering'] }}
          {%- endif -%}

      - alias: "Wait for any room to register presence"
        wait_template: >
          {%- set ns = namespace(any=false) -%}
          {%- for s in presence_list -%}
            {%- if is_state(s, 'on') -%}{%- set ns.any = true -%}{%- endif -%}
          {%- endfor -%}
          {{ ns.any }}
        timeout: "{{ arrival_wait_timeout_value }}"
        continue_on_timeout: false

  - alias: "Resolve target player, music source, playback state, and priority indices"
    variables:
      trigger_entity: "{{ trigger.entity_id }}"

      target_index: >
        {% if trigger.to_state.state == 'on' %}
          {% set ns = namespace(idx=-1) %}
          {% for s in presence_list %}
            {% if s == trigger_entity and ns.idx == -1 %}
              {% set ns.idx = loop.index0 %}
            {% endif %}
          {% endfor %}
          {{ ns.idx }}
        {% else %}
          {% set ns = namespace(idx=-1) %}
          {% for s in presence_list %}
            {% if states(s) | default('off') == 'on' and ns.idx == -1 %}
              {% set ns.idx = loop.index0 %}
            {% endif %}
          {% endfor %}
          {{ ns.idx }}
        {% endif %}

      target_player: >
        {% set ti = target_index | int(-1) %}
        {% if ti == -1 or ti >= player_list | length %}
          {{ '' }}
        {% else %}
          {{ player_list[ti] }}
        {% endif %}

      tts_pre_player: >
        {% set ti = target_index | int(-1) %}
        {% if ti >= 0 and tts_pre_player_list | length > ti %}
          {{ tts_pre_player_list[ti] }}
        {% else %}
          {{ target_player }}
        {% endif %}

      tts_post_player: >
        {% set ti = target_index | int(-1) %}
        {% if ti >= 0 and tts_post_player_list | length > ti %}
          {{ tts_post_player_list[ti] }}
        {% else %}
          {{ target_player }}
        {% endif %}

      min_music_duration: "{{ min_music_duration_value | int(0) }}"

      # Everything that may legitimately be the SOURCE of music.
      # Phone sources come AFTER player_list so a room player always wins when
      # both are playing. Both extras default to empty, so this is identical to
      # player_list for existing instances.
      # The SpotifyPlus entity is included last: when Spotify plays on the
      # PHONE nothing in player_list is playing, but that entity is — which both
      # satisfies the source gates and gives us something to pause, since a
      # phone is not an HA media_player.
      # NOTE: the same list is rebuilt inline in music_source_player,
      # any_music_playing AND any_music_active. It is deliberately NOT hoisted
      # into a shared variable: HA renders a template producing a list as a
      # NATIVE list, so passing it between templates via to_json/from_json
      # raises "Template error: from_json".
      # source_index and other_active_players keep using player_list, since
      # those are about ROOMS, not sources.
      # TWO PASSES, and the order matters. A room speaker left PAUSED with old
      # content would otherwise be picked as the source purely because
      # player_list is scanned first — shadowing a phone that is actively
      # playing, and then failing the "target != source" gate when that same
      # room is also the target. Actively playing always wins; paused is only
      # a fallback (which is what follow_paused_music is really for).
      music_source_player: >
        {% set _sp = spotifyplus_entity_id | default('') | string | trim %}
        {% set scan = (player_list + (arrival_source_list | default([], true))
                       + ([_sp] if _sp | length > 0 else [])) %}
        {% set ns = namespace(playing='', paused='') %}
        {% for p in scan %}
          {% set st = states(p) | default('unknown') %}
          {% if st in ['playing', 'paused', 'buffering'] %}
            {% set dur = state_attr(p, 'media_duration') | default(0) | float(0) %}
            {% if (dur == 0 and treat_unknown_duration_as_music_flag)
                  or (dur > 0 and dur >= min_music_duration) %}
              {% if st in ['playing', 'buffering'] and ns.playing == '' %}
                {% set ns.playing = p %}
              {% elif st == 'paused' and ns.paused == '' %}
                {% set ns.paused = p %}
              {% endif %}
            {% endif %}
          {% endif %}
        {% endfor %}
        {{ ns.playing if ns.playing != '' else ns.paused }}

      any_music_playing: >
        {% set _sp = spotifyplus_entity_id | default('') | string | trim %}
        {% set ns = namespace(any=false) %}
        {% for p in (player_list + (arrival_source_list | default([], true))
                     + ([_sp] if _sp | length > 0 else [])) %}
          {% if states(p) | default('unknown') == 'playing' %}
            {% set dur = state_attr(p, 'media_duration') | default(0) | float(0) %}
            {% if (dur == 0 and treat_unknown_duration_as_music_flag)
                  or (dur > 0 and dur >= min_music_duration) %}
              {% set ns.any = true %}
            {% endif %}
          {% endif %}
        {% endfor %}
        {{ ns.any }}

      any_music_active: >
        {% set valid_states = ['playing'] %}
        {% if follow_paused_music_flag | bool %}
          {% set valid_states = ['playing', 'paused'] %}
        {% endif %}
        {% set _sp = spotifyplus_entity_id | default('') | string | trim %}
        {% set ns = namespace(any=false) %}
        {% for p in (player_list + (arrival_source_list | default([], true))
                     + ([_sp] if _sp | length > 0 else [])) %}
          {% if states(p) | default('unknown') in valid_states %}
            {% set dur = state_attr(p, 'media_duration') | default(0) | float(0) %}
            {% if (dur == 0 and treat_unknown_duration_as_music_flag)
                  or (dur > 0 and dur >= min_music_duration) %}
              {% set ns.any = true %}
            {% endif %}
          {% endif %}
        {% endfor %}
        {{ ns.any }}

      source_index: >
        {% set ns = namespace(idx=-1) %}
        {% for p in player_list %}
          {% if p == music_source_player and ns.idx == -1 %}
            {% set ns.idx = loop.index0 %}
          {% endif %}
        {% endfor %}
        {{ ns.idx }}

      other_active_players: >
        {% set ns = namespace(others=[]) %}
        {% for p in player_list %}
          {% if p != target_player
                and states(p) | default('unknown') in ['playing', 'buffering'] %}
            {% set ns.others = ns.others + [p] %}
          {% endif %}
        {% endfor %}
        {{ ns.others | to_json }}

      target_state: "{{ states(target_player) | default('unknown') }}"

      # ── Spotify Connect backend resolution ────────────────────────────────
      # Same parallel-array idiom as target_player / tts_pre_player above.
      target_backend: >
        {%- set ti = target_index | int(-1) -%}
        {%- if ti >= 0 and transfer_backend_list_raw | length > ti -%}
          {{ transfer_backend_list_raw[ti] | default('ma_native', true) }}
        {%- else -%}
          ma_native
        {%- endif -%}

      target_connect_device_id: >
        {%- set ti = target_index | int(-1) -%}
        {%- if ti >= 0 and spotify_device_id_list | length > ti -%}
          {{ spotify_device_id_list[ti] | default('', true) | trim }}
        {%- else -%}
          {{ '' }}
        {%- endif -%}

      # True only when a live Spotify Connect session actually exists. When the
      # source is radio / local library instead, this is false and the room
      # transparently falls back to the Music Assistant queue transfer.
      #
      # Two independent signals, because the SpotifyPlus entity is known to go
      # stale and report 'off' while music is audibly playing (its poller
      # sleeps; toggling the entity revives it). Relying on it alone would
      # silently drop us to ma_native, which cannot move a mirrored session.
      #   1. SpotifyPlus says it is playing, OR
      #   2. the source MA player is MIRRORING Spotify — app_id 'spotify' with
      #      no active_queue is exactly the Alexa/Sonos virtual-line-in case.
      spotify_is_source: >
        {%- set sp = spotifyplus_entity_id | default('') | string | trim -%}
        {%- set sp_playing = sp | length > 0
              and states(sp) | default('unknown') == 'playing' -%}
        {%- set src = music_source_player | default('') | string | trim -%}
        {%- set mirroring = src | length > 0
              and (state_attr(src, 'app_id') | default('') | string | lower) == 'spotify'
              and state_attr(src, 'active_queue') in [none, '', 'None'] -%}
        {{ sp_playing or mirroring }}

      # Which app on the phone is playing, read straight from the companion
      # app's media-session sensor rather than inferred. Attributes are
      # namespaced per package, e.g. playback_state_com.spotify.music.
      # '' when no sensor is configured or neither app is active.
      arrival_phone_app: >
        {%- set s = arrival_media_sensor | default('') | string | trim -%}
        {%- if s | length == 0 -%}
          {{ '' }}
        {%- else -%}
          {%- set spot = state_attr(s, 'playback_state_' ~ arrival_spotify_pkg) -%}
          {%- set ma = state_attr(s, 'playback_state_' ~ arrival_ma_pkg) -%}
          {%- if spot in ['Playing', 'Buffering'] -%}
            spotify
          {%- elif ma in ['Playing', 'Buffering'] -%}
            ma
          {%- else -%}
            {{ '' }}
          {%- endif -%}
        {%- endif -%}

      effective_backend: >
        {%- if target_backend == 'spotify_connect'
               and spotify_is_source | bool
               and target_connect_device_id | length > 0 -%}
          spotify_connect
        {%- elif target_backend == 'ma_spotify' and spotify_is_source | bool -%}
          ma_spotify
        {%- else -%}
          ma_native
        {%- endif -%}

  # ---------------------------------------------------------------------------
  # All rooms empty — pause and stop. Runs BEFORE the target gates, because
  # when nobody is home target_index resolves to -1 and the automation would
  # otherwise bail out silently, leaving music playing to an empty house.
  #
  # Only fires on the presence-OFF trigger. Walking room to room is unaffected:
  # the destination sensor is ON, so the "nobody anywhere" check is false and a
  # normal transfer happens instead.
  # ---------------------------------------------------------------------------
  - alias: "All rooms empty — pause music and stop (optional)"
    if:
      - alias: "Fired by the all-rooms-clear trigger, and the option is enabled"
        condition: template
        value_template: >
          {{ stop_when_all_empty_flag | bool
             and trigger.id is defined
             and trigger.id == 'all_rooms_clear' }}
      - alias: "Still nobody home at the moment we act"
        condition: template
        value_template: >
          {%- set ns = namespace(any=false) -%}
          {%- for s in presence_list -%}
            {%- if is_state(s, 'on') -%}{%- set ns.any = true -%}{%- endif -%}
          {%- endfor -%}
          {{ not ns.any }}
    then:
      - alias: "Collect configured players that are still making noise"
        variables:
          empty_stop_targets: >
            {%- set ns = namespace(p=[]) -%}
            {%- for p in player_list -%}
              {%- if states(p) in ['playing', 'buffering'] -%}
                {%- set ns.p = ns.p + [p] -%}
              {%- endif -%}
            {%- endfor -%}
            {{ ns.p }}

      # Hand the session to the phone instead of pausing, when configured.
      # Tries first: if it fails, the pause below still runs, so the house is
      # never left playing to nobody.
      - alias: "Hand the session over to the phone (optional)"
        if:
          - condition: template
            value_template: >
              {{ empty_house_action_value == 'handover_to_phone'
                 and empty_house_phone_device_value | default('') | string | trim | length > 0
                 and spotifyplus_entity_id | default('') | string | trim | length > 0 }}
        then:
          - alias: "Move Spotify to the phone, paused unless told otherwise"
            continue_on_error: true
            action: pyscript.spotify_follow_me_transfer
            data:
              spotifyplus_entity: "{{ spotifyplus_entity_id }}"
              target_device_name: "{{ empty_house_phone_device_value }}"
              source_player: "{{ music_source_player }}"
              source_ma_player: "{{ music_source_player }}"
              autoplay: "{{ empty_house_autoplay_flag | bool }}"
              queue_depth: 10

      - alias: "Pause them"
        if:
          - condition: template
            value_template: "{{ empty_stop_targets | count > 0 }}"
        then:
          - alias: "Pause every configured player still playing"
            continue_on_error: true
            action: media_player.media_pause
            target:
              entity_id: "{{ empty_stop_targets }}"

      - alias: "Stop — nothing further to do with an empty house"
        stop: "All rooms empty — music paused"

  # ---------------------------------------------------------------------------
  # Arrival, Music Assistant source. Runs AFTER the resolve step because it
  # needs target_player, and BEFORE the normal gates because those all assume
  # an HA source entity — which a phone running the MA app does not have.
  #
  # music_assistant.transfer_queue cannot be used: it takes HA entity_ids.
  # pyscript.ma_phone_transfer talks to the MA server directly and matches the
  # target by its registry unique_id, which IS the MA player_id.
  # ---------------------------------------------------------------------------
  - alias: "Arrival — phone is on Music Assistant rather than Spotify"
    if:
      - condition: template
        value_template: >
          {#- Prefer the media-session sensor's verdict when we have one; fall
              back to "Spotify isn't the source" only when it is unconfigured. -#}
          {{ trigger.id is defined
             and trigger.id == 'person_arrived'
             and target_player | default('') | string | length > 0
             and (arrival_phone_app == 'ma'
                  if (arrival_media_sensor | default('') | string | trim | length > 0)
                  else not (spotify_is_source | bool)) }}
    then:
      - alias: "Ask Music Assistant to move the phone's queue to this room"
        continue_on_error: true
        action: pyscript.ma_phone_transfer
        data:
          target_player: "{{ target_player }}"
          room_players: "{{ player_list }}"
          auto_play: true
      - alias: "Stop — arrival handled (or nothing was playing)"
        stop: "Arrival handled via Music Assistant phone transfer"

  - alias: "Gate — only follow when music is playing or paused (optional)"
    condition: template
    value_template: >
      {% if not only_follow_when_playing_flag | bool %}
        true
      {% else %}
        {{ any_music_active | bool }}
      {% endif %}

  - alias: "Gate — valid target and source, not same player"
    condition: template
    value_template: >
      {{ target_player != '' and music_source_player != '' and target_player != music_source_player }}

  - alias: "Gate — source must be in allowed source players list (optional)"
    condition: template
    value_template: >
      {% if allowed_source_players_list | length == 0 %}
        true
      {% else %}
        {{ music_source_player in allowed_source_players_list }}
      {% endif %}

  - alias: "Gate — source must NOT be in excluded source players blacklist (optional)"
    condition: template
    value_template: >
      {% if excluded_source_players_list | length == 0 %}
        true
      {% else %}
        {{ music_source_player not in excluded_source_players_list }}
      {% endif %}

  - alias: "Gate — source room still occupied, don't steal music from another person (optional)"
    condition: template
    value_template: >
      {% if not skip_if_source_occupied_flag | bool %}
        true
      {% else %}
        {% set src_idx = source_index | int(-1) %}
        {% if src_idx == -1 %}
          true
        {% else %}
          {{ states(presence_list[src_idx]) | default('off') != 'on' }}
        {% endif %}
      {% endif %}

  - alias: "Gate — priority anchor prevents downgrade while source zone active (optional)"
    condition: template
    value_template: >
      {% if not enforce_priority_anchor_flag | bool %}
        true
      {% else %}
        {% set src_idx = source_index | int(-1) %}
        {% set tgt_idx = target_index | int(-1) %}
        {% if src_idx == -1 or tgt_idx == -1 %}
          true
        {% else %}
          {% set src_active = (states(presence_list[src_idx]) | default('off') == 'on') %}
          {% if not src_active %}
            true
          {% else %}
            {{ tgt_idx < src_idx }}
          {% endif %}
        {% endif %}
      {% endif %}

  - alias: "Gate — protect target playback, skip if target already playing (optional)"
    condition: template
    value_template: >
      {% if not protect_target_playback_flag | bool %}
        true
      {% else %}
        {{ target_state not in ['playing', 'buffering'] }}
      {% endif %}

  - alias: "Pre-transfer announcement — call script before moving queue (optional)"
    choose:
      - alias: "Pre-announcement enabled and music is active"
        conditions:
          - condition: template
            value_template: >
              {{ pre_announcements_enabled_flag | bool
                 and pre_announcement_script_entity is not none
                 and pre_announcement_script_entity != ''
                 and any_music_active | bool }}
        sequence:
          - alias: "Call pre-transfer announcement script — TTS targets pre-transfer speaker"
            continue_on_error: true
            action: script.turn_on
            target:
              entity_id: "{{ pre_announcement_script_entity }}"
            data:
              variables:
                target_player: "{{ target_player }}"
                source_player: "{{ music_source_player }}"
                tts_output_player: "{{ tts_pre_player }}"

  - alias: "Delay before transfer — gives TTS announcement a head start"
    delay:
      seconds: "{{ delay_seconds_value | int(0) }}"

  - alias: "Transfer — dispatch on backend (Spotify Connect or Music Assistant)"
    choose:
      # -----------------------------------------------------------------------
      # Spotify Connect: hand the live Connect session to the target device.
      # Used when the source is an Echo/Alexa playing out through a Connect
      # speaker — Music Assistant only mirrors that and cannot move it.
      # continue_on_error is required: player_transfer_playback raises
      # ServiceValidationError when the Spotify desktop token is missing or the
      # target speaker is unreachable, and the failure path must still run.
      # -----------------------------------------------------------------------
      - alias: "Spotify Connect — move the Connect session to the target device"
        conditions:
          - condition: template
            value_template: "{{ effective_backend == 'spotify_connect' }}"
        sequence:
          # Deliberately NOT spotifyplus.player_transfer_playback: on a Sonos
          # that wakes the device and resumes its OWN local queue, so you get
          # whatever was last played in that room instead of what you were
          # listening to. Verified in the field — walking into the bathroom
          # started a track from hours earlier.
          #
          # pyscript.spotify_follow_me_transfer instead wakes SpotifyPlus (a
          # transfer while its entity is 'off' silently no-ops), reads the live
          # track + position + upcoming queue, seeds the target with the real
          # content, and pauses the source so it is a move, not a duplicate.
          - alias: "Move Spotify session to target device (track + position + queue)"
            continue_on_error: true
            action: pyscript.spotify_follow_me_transfer
            data:
              spotifyplus_entity: "{{ spotifyplus_entity_id }}"
              target_device_id: "{{ target_connect_device_id }}"
              source_player: "{{ music_source_player }}"
              source_ma_player: "{{ music_source_player }}"
              # target_player lets the service VERIFY playback started before
              # pausing the source. Without it, a failed transfer silences
              # every room — which is exactly what happened in testing.
              target_player: "{{ target_player }}"
              # 10, not 20: at 20 SpotifyPlus hit
              # GetPlayerPlaybackStateSonos -> GetTrack on an unresolvable
              # queued URI and the target never started.
              queue_depth: 10

      # -----------------------------------------------------------------------
      # Music Assistant target that is NOT a Spotify Connect endpoint — e.g. an
      # ESPHome Voice PE. Same service, no device_id: it plays the tracks on the
      # MA player directly and MA streams them.
      #
      # music_assistant.transfer_queue is NOT usable here: it moves an MA queue
      # between MA players, and a source that is merely MIRRORING an Alexa
      # session has no queue to move — verified, returns HTTP 500.
      # Requires MA >= 2.9.13 (#5601 fixed Spotify playback authorization).
      # -----------------------------------------------------------------------
      - alias: "Spotify via Music Assistant — play on a non-Connect MA player"
        conditions:
          - condition: template
            value_template: "{{ effective_backend == 'ma_spotify' }}"
        sequence:
          - alias: "Play the Spotify session on the target MA player"
            continue_on_error: true
            action: pyscript.spotify_follow_me_transfer
            data:
              spotifyplus_entity: "{{ spotifyplus_entity_id }}"
              target_device_id: ""
              target_player: "{{ target_player }}"
              source_player: "{{ music_source_player }}"
              source_ma_player: "{{ music_source_player }}"
              ma_seek: "{{ ma_seek_flag | bool }}"
              queue_depth: 10

    default:
      - alias: "Music Assistant queue transfer — original behaviour"
        choose:
          - alias: "Music is actively playing (not just paused) — transfer with auto_play true"
            conditions:
              - condition: template
                value_template: "{{ any_music_playing | bool }}"
            sequence:
              - alias: "Transfer queue to target player (auto_play: true)"
                continue_on_error: true
                action: music_assistant.transfer_queue
                target:
                  entity_id: "{{ target_player }}"
                data:
                  source_player: "{{ music_source_player }}"
                  auto_play: true
        default:
          - alias: "Transfer queue to target player (auto_play: false) — source was paused or idle"
            continue_on_error: true
            action: music_assistant.transfer_queue
            target:
              entity_id: "{{ target_player }}"
            data:
              source_player: "{{ music_source_player }}"
              auto_play: false

  # Poll rather than sleep. A fixed delay has to be long enough for the SLOWEST
  # backend, which makes every fast transfer wait for no reason — and if it is
  # too short (the default 2s is, for Spotify Connect) the success check runs
  # before the target has started and a FALSE failure gets announced while the
  # music is in fact on its way. This returns the instant the target starts.
  - alias: "Post-transfer settling — wait for the target to actually start"
    wait_template: >
      {{ states(target_player) | default('unknown') in ['playing', 'buffering'] }}
    timeout:
      seconds: "{{ post_transfer_settle_seconds_value | int(2) }}"
    continue_on_timeout: true

  - alias: "Evaluate transfer success — target must now be playing/paused/buffering"
    variables:
      transfer_succeeded: >
        {% set post_state = states(target_player) | default('unknown') %}
        {{ post_state in ['playing', 'paused', 'buffering'] }}
      failure_reason: >
        {% if not transfer_succeeded | bool %}
          {%- if effective_backend == 'spotify_connect' -%}
            Spotify Connect transfer failed — the target speaker may be unreachable, or the Spotify desktop token may need regenerating
          {%- else -%}
            Music Assistant could not move the queue — the source player may be stuck or the queue may have been lost
          {%- endif -%}
        {% endif %}

  - alias: "On success — stamp cooldown, silence others, announce arrival"
    choose:
      - alias: "Transfer succeeded — run post-transfer steps"
        conditions:
          - condition: template
            value_template: "{{ transfer_succeeded | bool }}"
        sequence:
          - alias: "Update cooldown helper timestamp after successful transfer (optional)"
            choose:
              - alias: "Cooldown enabled and helper configured"
                conditions:
                  - condition: template
                    value_template: >
                      {{ cooldown_seconds_value | int(0) > 0
                         and cooldown_helper_entity is not none
                         and cooldown_helper_entity != '' }}
                sequence:
                  - alias: "Stamp current time into cooldown helper"
                    continue_on_error: true
                    action: input_datetime.set_datetime
                    target:
                      entity_id: "{{ cooldown_helper_entity }}"
                    data:
                      datetime: "{{ now().isoformat() }}"

          - alias: "Silence other players — stop all non-target players after transfer (optional)"
            choose:
              - alias: "Exclusive-room enabled and other players are active"
                conditions:
                  - condition: template
                    value_template: >
                      {% set players = other_active_players if other_active_players is list
                         else (other_active_players | trim | from_json | default([])) %}
                      {{ silence_other_players_flag | bool and players | length > 0 }}
                sequence:
                  - alias: "Stop all configured players except the transfer target"
                    continue_on_error: true
                    action: media_player.media_stop
                    target:
                      entity_id: >
                        {% set players = other_active_players if other_active_players is list
                           else (other_active_players | trim | from_json | default([])) %}
                        {{ players }}

          - alias: "Post-transfer announcement — call script after moving queue (optional)"
            choose:
              - alias: "Post-announcement enabled and script configured"
                conditions:
                  - condition: template
                    value_template: >
                      {{ announcements_enabled_flag | bool
                         and announcement_script_entity is not none
                         and announcement_script_entity != '' }}
                sequence:
                  - alias: "Call post-transfer announcement script — TTS targets post-transfer speaker"
                    continue_on_error: true
                    action: script.turn_on
                    target:
                      entity_id: "{{ announcement_script_entity }}"
                    data:
                      variables:
                        target_player: "{{ target_player }}"
                        source_player: "{{ music_source_player }}"
                        tts_output_player: "{{ tts_post_player }}"

  - alias: "On failure — announce the problem so the user knows what happened (optional)"
    choose:
      - alias: "Transfer failed and failure announcements are enabled"
        conditions:
          # NOTE: deliberately NOT gated on announcements_enabled_flag. Failure
          # announcements are a separate opt-in: you may want silence on every
          # successful move but still be told out loud when a transfer breaks.
          # Previously this required both flags, so announce_transfer_failure
          # could never fire while announcements_enabled was off.
          - condition: template
            value_template: >
              {{ not (transfer_succeeded | bool)
                 and announce_transfer_failure_flag | bool
                 and announcement_script_entity is not none
                 and announcement_script_entity != '' }}
        sequence:
          - alias: "Call announcement script with failure context — script/LLM crafts the message"
            continue_on_error: true
            action: script.turn_on
            target:
              entity_id: "{{ announcement_script_entity }}"
            data:
              variables:
                target_player: "{{ target_player }}"
                source_player: "{{ music_source_player }}"
                tts_output_player: "{{ tts_post_player }}"
                transfer_failed: true
                failure_reason: "{{ failure_reason }}"