# =============================================================================
# AI Phone Call Detection — I-30 of P2 Integration
# =============================================================================
# Detects active phone calls via companion app sensor and defers TTS.
# When call ends, fires tts_queue_flush_deferred to play deferred items.
#
# Provides:
#   sensor.ai_phone_call_active             — auto-set by automation (Session 8 migration)
#   input_boolean.ai_phone_call_defer_tts   — defer TTS during calls
#   automation.ai_phone_call_start          — detect call start
#   automation.ai_phone_call_end            — detect call end + flush
#
# Sensors: every person's Companion App phone_state sensor (idle / ringing /
#          offhook), listed in sensor.ai_person_phones by person_phones.py
# Dependencies: pyscript/person_phones.py (finds each person's phone)
#               pyscript/tts_queue.py (deferred queue + flush event)
#               pyscript/state_bridge.py (set_sensor_value service)
# Deployed: 2026-03-04 | Updated: 2026-10-30 (phones discovered, no hardcoded phone)
# =============================================================================

# ── INPUT HELPERS ────────────────────────────────────────────────────────────

# input_boolean.ai_phone_call_active removed — migrated to sensor (state.set, Session 8)

# ── AUTOMATIONS ──────────────────────────────────────────────────────────────

automation:
  # ── CALL START ──────────────────────────────────────────────────────────
  - id: ai_phone_call_start
    alias: "AI - Phone Call Start"
    description: "Set phone call active when any person's phone is ringing or offhook"
    mode: single
    triggers:
      # Fires when the first phone enters a call.
      - trigger: template
        id: call_started
        value_template: >-
          {{ state_attr('sensor.ai_person_phones', 'phone_state_entities')
             | default([], true) | select('is_state', ['ringing', 'offhook'])
             | list | count > 0 }}
    conditions:
      - condition: state
        entity_id: sensor.ai_phone_call_active
        state: "off"
    actions:
      - action: pyscript.set_sensor_value
        data:
          entity_id: sensor.ai_phone_call_active
          value: "on"
          icon: "mdi:phone-in-talk"
          friendly_name: "AI Phone Call Active"

  # ── CALL END ────────────────────────────────────────────────────────────
  - id: ai_phone_call_end
    alias: "AI - Phone Call End"
    description: "Clear phone call active once no phone is in a call, flush deferred TTS"
    mode: single
    triggers:
      # Fires when no phone is ringing or offhook and at least one is idle.
      # Requiring idle keeps the old meaning: a phone that drops to
      # unavailable mid-call does not end the call.
      - trigger: template
        id: call_ended
        value_template: >-
          {%- set phones = state_attr('sensor.ai_person_phones', 'phone_state_entities')
                           | default([], true) -%}
          {{ phones | select('is_state', ['ringing', 'offhook']) | list | count == 0
             and phones | select('is_state', 'idle') | list | count > 0 }}
    conditions:
      - condition: state
        entity_id: sensor.ai_phone_call_active
        state: "on"
    actions:
      - action: pyscript.set_sensor_value
        data:
          entity_id: sensor.ai_phone_call_active
          value: "off"
          icon: "mdi:phone-in-talk"
          friendly_name: "AI Phone Call Active"
      # Flush deferred TTS items
      - delay: "00:00:02"
      - continue_on_error: true
        action: pyscript.tts_queue_flush_deferred
